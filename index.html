
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alien Cow Galactic Farm</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: radial-gradient(circle, #2a0845 0%, #000000 100%); color: #00ffcc; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; user-select: none; }
        h1 { font-size: 1.5rem; text-shadow: 0 0 15px #00ffcc; }
        .stat-box { font-size: 2rem; font-weight: bold; margin: 10px; }
        #cow { width: 220px; cursor: pointer; transition: transform 0.1s; filter: drop-shadow(0 0 15px #00ffcc); }
        #cow:active { transform: scale(0.8); }
        .shop-btn { background: #00ffcc; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; border: none; }
        #shop-menu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 2px solid #00ffcc; padding: 20px; border-radius: 20px; width: 80%; z-index: 100; }
        .shop-item { background: #1a0b2e; padding: 15px; border-radius: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: #ffcc00; color: #000; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #ton-connect-button { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="ton-connect-button"></div>
    <h1>🛸 ALIEN COW FARM 🐮</h1>
    <div class="stat-box">Moon-Milk: <span id="score">0</span> 🥛</div>
    <div style="font-size: 0.9rem; margin-bottom: 10px;">Power: <span id="power">1</span> per click</div>
    <img id="cow" src="https://cdn-icons-png.flaticon.com/512/235/235359.png" alt="Alien Cow">
    <button class="shop-btn" onclick="toggleShop()">🚀 UPGRADE SHOP</button>
    <div id="shop-menu">
        <h2>Galactic Shop</h2>
        <div class="shop-item">
            <span>Super Feed (+1 Power) <br> <small>Price: 1 TON</small></span>
            <button class="buy-btn" onclick="buyUpgrade()">BUY</button>
        </div>
        <button class="shop-btn" onclick="toggleShop()">CLOSE</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://umkyohkbcvuzkekxtayl.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_tmI4W5ftZt_qbubsM38oFg_mzAl9Cr2'; // <--- MAKE SURE THIS IS YOUR REAL KEY
        const MY_WALLET_ADDRESS = 'UQCwc-rD5p0_wDaXziXjX35IISbIqp-f3amZMEUFiu_KYo2T'; // <--- MAKE SURE THIS IS YOUR REAL ADDRESS
        const UPGRADE_PRICE = 1.0;

        // Initialize Supabase safely
        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) { console.error("Supabase Init Error"); }

        const tg = window.Telegram.WebApp;
        tg.expand();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI.TonConnectUI();
        tonConnectUI.createTonConnectButton().then(node => {
            document.getElementById('ton-connect-button').appendChild(node);
        });

        const userId = tg.initDataUnsafe?.user?.id || 'guest_user';
        let score = 0;
        let power = 1;
        const scoreEl = document.getElementById('score');
        const powerEl = document.getElementById('power');
        const cowEl = document.getElementById('cow');

        async function loadPlayerData() {
            if (!supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('players').select('balance').eq('telegram_id', userId).single();
                if (data) { score = data.balance; } 
                else { await supabaseClient.from('players').insert([{ telegram_id: userId, balance: 0 }]); }
            } catch (e) { console.log("Load error"); }
            scoreEl.innerText = score;
        }

        async function saveScore() {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('players').update({ balance: score }).eq('telegram_id', userId);
            } catch (e) { console.log("Save error"); }
        }

        // THE FIX: Update screen FIRST, save in background
        cowEl.onclick = () => {
            score += power;
            scoreEl.innerText = score;
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            // Run save in background without 'await' so the UI never freezes
            saveScore(); 
        };

        function toggleShop() {
            const menu = document.getElementById('shop-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        async function buyUpgrade() {
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [{
                    address: UQCwc-rD5p0_wDaXziXjX35IISbIqp-f3amZMEUFiu_KYo2T,
                    amount: (UPGRADE_PRICE * 1000000000).toString(),
                }],
            };
            try {
                await tonConnectUI.sendTransaction(transaction);
                power++;
                powerEl.innerText = power;
                alert("Upgrade Successful! 🐮✨");
            } catch (e) {
                alert("Payment failed.");
            }
        }
        loadPlayerData();
    </script>
</body>
</html>
