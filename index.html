<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON COW SLOTS 🎰</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { background: #050505; color: #00ffcc; font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .neon-text { text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; }
        .neon-border { border: 4px solid #00ffcc; box-shadow: 0 0 15px #00ffcc, inset 0 0 10px #00ffcc; }
        #game-content { width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        .slot-machine { background: #111; padding: 20px; border-radius: 15px; margin: 20px; position: relative; }
        .reels { display: flex; gap: 10px; margin-bottom: 20px; }
        .reel { width: 80px; height: 80px; background: #222; border: 3px solid #ff00ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 0 10px #ff00ff; }
        .stat-box { font-size: 1rem; margin: 10px; color: #ffff00; }
        .spin-btn { background: #ff00ff; color: #fff; padding: 15px 30px; border: none; font-family: 'Press Start 2P'; cursor: pointer; box-shadow: 0 0 15px #ff00ff; }
        .spin-btn:disabled { background: #555; box-shadow: none; }
        .menu-btn { background: none; color: #00ffcc; border: 2px solid #00ffcc; padding: 10px; margin: 5px; font-family: 'Press Start 2P'; cursor: pointer; font-size: 0.6rem; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 500; flex-direction: column; align-items: center; justify-content: center; }
        .modal { background: #000; border: 4px solid #00ffcc; padding: 20px; width: 80%; max-height: 70%; overflow-y: auto; }
        .rank-item { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.7rem; border-bottom: 1px solid #333; }
        #wallet-btn-container { margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="game-content">
        <div id="wallet-btn-container"></div>
        <h1 class="neon-text">NEON COW 🎰</h1>
        <div class="stat-box">COINS: <span id="balance">0</span> 🪙</div>

        <div class="slot-machine neon-border">
            <div class="reels">
                <div id="reel1" class="reel">🐮</div>
                <div id="reel2" class="reel">🐮</div>
                <div id="reel3" class="reel">🐮</div>
            </div>
            <button id="spin-button" class="spin-btn" onclick="spin()">SPIN (10 🪙)</button>
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="menu-btn" onclick="showModal('shop')">SHOP 🛒</button>
            <button class="menu-btn" onclick="showModal('ranks')">RANKS 🏆</button>
        </div>
    </div>

    <div id="overlay">
        <div class="modal" id="modal-content"></div>
        <button class="menu-btn" onclick="closeModal()">CLOSE X</button>
    </div>

    <script>
        // --- CONFIG ---
        const SUPABASE_URL = 'https://umkyohkbcvuzkekxtayl.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_tmI4W5ftZt_qbubsM38oFg_mzAl9Cr2'; 
        const MY_WALLET_ADDRESS = 'UQCwc-rD5p0_wDaXziXjX35IISbIqp-f3amZMEUFiu_KYo2T';
        const GRAM_PRICE = 1.0;

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI.TonConnectUI();
        const symbols = ['🐮', '💎', '🌟', '🚀', '🪐'];

        // Wallet Button (Optional Connection)
        tonConnectUI.createTonConnectButton().then(node => {
            document.getElementById('wallet-btn-container').appendChild(node);
        });

        const userId = tg.initDataUnsafe?.user?.id || 'guest_user';
        let balance = 0;

        async function loadUser() {
            const { data } = await supabaseClient.from('players').select('balance').eq('telegram_id', userId).single();
            balance = data ? data.balance : 100; 
            if (!data) await supabaseClient.from('players').insert([{ telegram_id: userId, balance: 100 }]);
            updateUI();
        }

        function updateUI() { document.getElementById('balance').innerText = balance; }

        async function spin() {
            if (balance < 10) return alert("Out of coins! Connect wallet and buy more in Shop.");
            balance -= 10;
            updateUI();
            const btn = document.getElementById('spin-button');
            btn.disabled = true;

            let count = 0;
            const interval = setInterval(() => {
                document.getElementById('reel1').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel2').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel3').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                count++;
                if (count > 20) {
                    clearInterval(interval);
                    finalizeSpin();
                }
            }, 50);
        }

        async function finalizeSpin() {
            const r1 = document.getElementById('reel1').innerText;
            const r2 = document.getElementById('reel2').innerText;
            const r3 = document.getElementById('reel3').innerText;
            const btn = document.getElementById('spin-button');

            if (r1 === r2 && r2 === r3) {
                balance += 500;
                alert(`JACKPOT! +500 coins! 🎊`);
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                balance += 20;
                alert(`Small Win! +20 coins!`);
            }

            updateUI();
            await supabaseClient.from('players').update({ balance }).eq('telegram_id', userId);
            btn.disabled = false;
        }

        function showModal(type) {
            const overlay = document.getElementById('overlay');
            const content = document.getElementById('modal-content');
            overlay.style.display = 'flex';
            if (type === 'shop') {
                content.innerHTML = `<h2 class="neon-text">COIN SHOP</h2><div class="shop-item"><span>1000 Coins <br> <small>Price: 1 GRAM</small></span><button class="buy-btn" onclick="buyCoins()">BUY</button></div>`;
            } else if (type === 'ranks') {
                loadRanks(content);
            }
        }

        async function loadRanks(container) {
            container.innerHTML = `<h2 class="neon-text">TOP FARMERS</h2>`;
            const { data } = await supabaseClient.from('players').select('telegram_id, balance').order('balance', { ascending: false }).limit(10);
            data.forEach((p, i) => {
                container.innerHTML += `<div class="rank-item"><span>#${i+1} ${p.telegram_id}</span><span>${p.balance} 🪙</span></div>`;
            });
        }

        async function buyCoins() {
            if (!tonConnectUI.connected) {
                alert("Please connect your wallet first using the button at the top!");
                return;
            }
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [{ address: MY_WALLET_ADDRESS, amount: (GRAM_PRICE * 1000000000).toString() }],
            };
            try {
                await tonConnectUI.sendTransaction(transaction);
                balance += 1000;
                updateUI();
                await supabaseClient.from('players').update({ balance }).eq('telegram_id', userId);
                alert("Coins added to your account!");
            } catch (e) { alert("Payment failed."); }
        }

        function closeModal() { document.getElementById('overlay').style.display = 'none'; }

        loadUser();
    </script>
</body>
</html
